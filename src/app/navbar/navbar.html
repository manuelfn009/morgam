<div class="fixed top-0 w-full z-50">

  <nav 
    [class]="
      'transition-all duration-500 border-b ' +
      (isScrolled 
        ? 'bg-white/80 backdrop-blur-xl shadow-md border-zinc-200/50 py-3' 
        : 'bg-transparent border-transparent py-5')
    "
  >

    <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">

      <!-- Logo -->
      <a 
        class="text-lg tracking-[6px] font-light cursor-pointer transition"
        [class]="isScrolled ? 'text-black' : 'text-white'"
      >
        MORGAM
      </a>

      <!-- Menú -->
      <div class="hidden md:flex items-center space-x-10">
        
        <a
          routerLink="/"
          class="nav-link"
          [class]="isScrolled 
            ? 'text-zinc-700 hover:text-black' 
            : 'text-white/80 hover:text-white'"
        >
          ALMOGROTE
        </a>

        <a
          routerLink="/acerca"
          class="nav-link"
          [class]="isScrolled 
            ? 'text-zinc-700 hover:text-black' 
            : 'text-white/80 hover:text-white'"
        >
          MOJOS
        </a>

        <a
          routerLink="/contacto"
          class="nav-link"
          [class]="isScrolled 
            ? 'text-zinc-700 hover:text-black' 
            : 'text-white/80 hover:text-white'"
        >
          CREMAS
        </a>

      </div>

      <!-- Iconos -->
      <div 
        class="flex items-center space-x-5 transition"
        [class]="isScrolled ? 'text-zinc-700' : 'text-white'"
      >
        
        <button class="icon-btn">
          <i class="fa-solid fa-magnifying-glass text-sm"></i>
        </button>

        <button class="icon-btn">
          <i class="fa-regular fa-user text-sm"></i>
        </button>

        <button class="relative icon-btn">
          <i class="fa-solid fa-basket-shopping text-sm"></i>

          <span class="absolute -top-2 -right-2 text-[10px] bg-black text-white rounded-full px-1.5 py-[1px]">
            0
          </span>
        </button>

      </div>

    </div>

  </nav>

</div>
