<!-- HERO -->
<div class="relative w-full h-screen overflow-hidden">

  <!-- Imagen principal -->
  <img
    id="heroImage"
    src="assets/almogrote_mojo.png"
    alt="Productos gourmet de Canarias"
    class="w-full h-full object-cover scale-105"
  />

  <!-- Overlay degradado -->
  <div
    class="absolute inset-0 bg-gradient-to-r from-black/70 via-black/40 to-transparent"
  ></div>

  <!-- Contenido del hero -->
  <div class="absolute inset-0 flex items-center px-6 md:px-20">

    <div class="max-w-xl text-white">

      <h1 class="text-4xl md:text-6xl tracking-[6px] font-light mb-4">
        MORGAM
      </h1>

      <p class="text-lg md:text-2xl text-zinc-200 mb-8 leading-relaxed">
        Descubre el auténtico sabor de Canarias
      </p>

      <a
        href="#productos"
        class="inline-block border border-white px-8 py-3 text-sm tracking-[2px]
               hover:bg-white hover:text-black transition-all duration-300"
      >
        EXPLORAR PRODUCTOS
      </a>

    </div>

  </div>

</div>


<!-- PRODUCTOS -->
<section
  id="productos"
  class="bg-white py-24 px-6 md:px-20"
>
  <div class="max-w-7xl mx-auto">

    <!-- Encabezado -->
    <div
      class="mb-20 text-center reveal"
      appReveal
    >
      <h2 class="text-3xl md:text-5xl tracking-[6px] font-light mb-6">
        PRODUCTOS DESTACADOS
      </h2>

      <p class="text-zinc-500 max-w-xl mx-auto leading-relaxed">
        Elaboraciones artesanales con ingredientes seleccionados de Canarias
      </p>
    </div>

    <!-- Grid de productos -->
    <div
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12 items-stretch"
    >

      <!-- Tarjeta repetida por cada producto -->
      <div
        *ngFor="let producto of productos; let i = index"
        class="group cursor-pointer reveal flex flex-col h-full"
        appReveal
        [attr.data-delay]="i + 1"
      >

        <!-- Imagen -->
        <div class="relative overflow-hidden rounded-xl mb-5 bg-white">

          <img
            [src]="producto.ruta_imagen"
            [alt]="producto['nombre producto']"
            class="w-full h-80 object-contain p-4
                   transition duration-700
                   group-hover:scale-110"
          />

          <!-- Overlay -->
          <div
            class="absolute inset-0 bg-black/0
                   group-hover:bg-black/10
                   transition duration-500"
          ></div>

        </div>

        <!-- Nombre -->
        <h3 class="text-lg tracking-[3px] mb-2 uppercase">
          {{ producto['nombre producto'] }}
        </h3>

        <!-- Descripción -->
        <p class="text-zinc-500 text-sm mb-5 leading-relaxed">
          {{ producto.descripcion }}
        </p>

        <!-- Precio y botón alineados abajo -->
        <div class="mt-auto">

          <span class="block text-black font-medium mb-5">
            {{ producto.precio | number:'1.2-2' }} €
          </span>

          <button
            type="button"
            (click)="agregarAlCarrito(producto)"
            class="w-full border border-black px-6 py-3
                   text-sm tracking-[2px]
                   hover:bg-black hover:text-white
                   transition-all duration-300"
          >
            AÑADIR AL CARRITO
          </button>

        </div>

      </div>

    </div>

  </div>
</section>
